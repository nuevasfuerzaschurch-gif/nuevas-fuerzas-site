<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Carnet Elizabeth Carrera | Nuevas Fuerzas</title>
    <link rel="stylesheet" href="./carnet.css" />
  </head>
  <body>
    <script id="credential-data" type="application/json">
      {
        "fullName": "Elizabeth Carrera",
        "type": "Servidor",
        "ministry": "Administrativa",
        "status": "Activo",
        "issuedAt": "2026-05-23",
        "photoUrl": "./fotos/elizabeth-carrera.png",
        "note": "Carnet digital de servidor de Iglesia Cuadrangular Nuevas Fuerzas."
      }
    </script>

    <main class="credential-page">
      <section class="credential-shell" aria-label="Carnet digital">
        <article class="credential-card">
          <div class="credential-hero">
            <div class="credential-brand">
              <div class="brand-lockup" aria-label="Logo Nuevas Fuerzas">
                <span class="brand-mark" aria-hidden="true">NF</span>
                <span>
                  <strong>Nuevas Fuerzas</strong>
                  <small>Iglesia Cuadrangular</small>
                </span>
              </div>
              <span class="credential-status" data-status>Activo</span>
            </div>

            <div class="credential-person">
              <div class="credential-photo" data-photo>
                <span class="credential-initials" data-initials>EC</span>
              </div>
              <div>
                <p class="credential-kicker">Carnet digital</p>
                <h1 class="credential-name" data-name>Elizabeth Carrera</h1>
                <span class="credential-type" data-type>Servidor</span>
              </div>
            </div>
          </div>

          <div class="credential-details">
            <div class="detail-grid">
              <div class="detail-item">
                <span>Ministerio o área</span>
                <strong data-ministry>Administrativa</strong>
              </div>
              <div class="detail-item">
                <span>Estado</span>
                <strong data-status>Activo</strong>
              </div>
              <div class="detail-item">
                <span>Fecha de emisión</span>
                <strong data-issued>2026-05-23</strong>
              </div>
            </div>
            <p class="credential-note" data-note>
              Carnet digital de servidor de Iglesia Cuadrangular Nuevas Fuerzas.
            </p>
            <div class="credential-actions">
              <a class="button" href="../index.html">Volver al sitio principal</a>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script src="./carnet.js"></script>
  </body>
</html>
